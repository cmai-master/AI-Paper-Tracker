global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # PaperPulse API metrics
  - job_name: 'paperpulse-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  # Celery worker metrics
  - job_name: 'paperpulse-celery'
    static_configs:
      - targets: ['celery-worker:9091']

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # PostgreSQL exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
