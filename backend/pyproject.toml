[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpulse"
version = "0.1.0"
description = "AI/LLM Paper Tracking System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PaperPulse Team"}
]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",

    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",

    # Redis & Caching
    "redis>=5.0.1",
    "hiredis>=2.3.2",

    # Task Queue
    "celery>=5.3.6",
    "flower>=2.0.1",

    # HTTP Client
    "httpx>=0.26.0",
    "aiohttp>=3.9.1",

    # PDF Processing
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.3",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",

    # NLP & ML
    "transformers>=4.37.0",
    "torch>=2.1.0",
    "sentence-transformers>=2.3.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "langchain>=0.1.7",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.20",

    # Vector & Knowledge Graph
    "numpy>=1.26.0",
    "faiss-cpu>=1.7.4",
    "networkx>=3.2.1",
    "lightrag-hku>=0.0.1",

    # Data Processing
    "pandas>=2.1.4",
    "scikit-learn>=1.4.0",

    # XML/HTML Parsing
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",

    # Utilities
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",

    # Monitoring & Logging
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",

    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.0",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
